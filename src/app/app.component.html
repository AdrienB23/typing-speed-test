<main>
  <app-header [personalBest]="personalBest"></app-header>
  @if (appView === AppView.HOME) {
    <app-home [(homeState)]="homeState" (testFinished)="onTestFinished()"></app-home>
  } @else {
    <app-results></app-results>
  }
  @if (appView === AppView.HOME && homeState === HomeState.STARTED) {
    <app-footer [(homeState)]="homeState" ></app-footer>
  }
</main>
