<main [class.results]="appView === AppView.RESULTS">
  <app-header [personalBest]="personalBest" [lang]="lang" (onLangChange)="changeLang($event)"></app-header>
  <div class="content" [class.overflow]="appView === AppView.HOME">
    @if (appView === AppView.HOME) {
      <app-home [(homeState)]="homeState" [(wpm)]="wpm" [(accuracy)]="accuracy" [lang]="lang"
                [(correctChars)]="correctChar" [(wrongChars)]="wrongChars" (testFinished)="onTestFinished()"
                (personalBestChange)="onPersonalBestChange($event)"
                (keyStatsChange)="onKeyStatsChange($event)"></app-home>
    } @else {
      <app-results [keyStats]="keyStats" [resultState]="resultState" [wpm]="wpm" [accuracy]="accuracy"
                   [correctChars]="correctChar" [wrongChars]="wrongChars" (restartTest)="restartTest()"></app-results>
    }
  </div>
  @if (appView === AppView.HOME && homeState === HomeState.STARTED) {
    <app-footer [(homeState)]="homeState"></app-footer>
  }
</main>
