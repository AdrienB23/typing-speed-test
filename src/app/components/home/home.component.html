<div class="main-content">
  <div class="stats-container">
    <div class="stats-row">
      <div class="stats-cell">
        <span class="text-3 secondary">WPM:</span>
        <span class="text-2 primary b">{{ wpm }}</span>
      </div>
      <div class="divider"></div>
      <div class="stats-cell">
        <span class="text-3 secondary">Accuracy:</span>
        <span class="text-2 primary b">{{ accuracy }}%</span>
      </div>
      <div class="divider"></div>
      <div class="stats-cell">
        <span class="text-3 secondary">Time:</span>
        <span class="text-2 primary b">{{ time }}</span>
      </div>
    </div>
    <div class="settings-container">
      <div class="setting-container">
        <div class="setting-label-container">
          <span class="text-5 secondary">Difficulty:</span>
        </div>
        <p-select-button [allowEmpty]="false" [options]="difficultyOptions" [(ngModel)]="selectedDifficulty"
                         (onChange)="loadText()" optionLabel="label" optionValue="value"></p-select-button>
      </div>
      <div class="divider"></div>
      <div class="setting-container">
        <div class="setting-label-container">
          <span class="text-5 secondary">Mode:</span>
        </div>
        <p-select-button [allowEmpty]="false" [options]="modeOptions" [(ngModel)]="selectedMode" optionLabel="label"
                         optionValue="value"></p-select-button>
      </div>
    </div>
  </div>
  <div class="text-container">
    <div class="text-row">
      <div [class]="{
        'text-box': true,
        'blur': homeState === HomeState.NOT_STARTED
      }">
        <p class="text-1 r primary">
          @let currentText = currentText$ | async;

          @if (currentText) {
            {{ currentText.text }}
          }
        </p>
      </div>
      @if (homeState === HomeState.NOT_STARTED) {
        <div class="start-container">
          <button class="button-primary text-3 sb" (click)="startTest()">Start Typing Test</button>
          <p class="text-3 sb primary">Or click the text and start typing</p>
        </div>
      }
    </div>
  </div>
</div>
